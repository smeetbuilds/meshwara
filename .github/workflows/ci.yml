name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies for probe
        run: bun install

      - name: Show regenerated lockfile diff
        run: git diff -- bun.lock

      - name: Run QA and release audit
        run: bun run qa && bun run release:audit

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run E2E
        run: bun run e2e

      - name: Show working-tree diff
        if: always()
        run: git status --short && git diff -- bun.lock
